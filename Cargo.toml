[package]
name = "ufo"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Unreliable but Fast Optics code"

[dependencies]
bitflags = "2.6"
bytemuck = { version = "1.18", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
nalgebra = "0.33"
opencl3 = { version = "0.12", optional = true }
pest = "2.7"
pest_derive = "2.7"
thiserror = "2.0"

[dev-dependencies]
approx = "0.5"
assert_cmd = "2.0"
predicates = "3.1"

[features]
default = ["opencl"]
opencl = ["dep:opencl3"]
